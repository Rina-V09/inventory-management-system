<div class="app-container" [ngClass]="themeClass">
  @if (isSidebarOpen) {
    <div class="sidebar-overlay" 
         (click)="toggleSidebar()" 
         (keydown.escape)="toggleSidebar()"
         role="button" 
         tabindex="0" 
         aria-label="Close Sidebar Overview">
    </div>
  }
  
  <app-sidebar class="app-sidebar" [class.open]="isSidebarOpen"></app-sidebar> 
  
  <div class="content-wrapper">
    <app-top-navbar [role]="userRole" (menuToggle)="toggleSidebar()"></app-top-navbar>
    <main class="main-content">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
