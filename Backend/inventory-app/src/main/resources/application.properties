# DB credentials: set MYSQL_PASSWORD (and optionally MYSQL_USER) in the environment.

spring.application.name=inventory-app
spring.datasource.url=jdbc:mysql://localhost:3306/RETAILNET_INVENTORY_DB
spring.datasource.username=${MYSQL_USER:root}
spring.datasource.password=${MYSQL_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
server.port=8081

spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8080/realms/retailnet
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:8080/realms/retailnet/protocol/openid-connect/certs
